<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>ExLab · 移动端</title><link rel="stylesheet" href="/mobile/mobile.css"><link rel="stylesheet" href="/mobile/connect.css"><link rel="icon" href="/favicon.ico"></head>
<body class="access">
<header class="top"><div><span class="eyebrow">EXLAB / MONITOR</span><h1>移动端<span>你的随身实验台</span></h1></div><a class="back-link" href="/">← 返回主控</a></header>
<main><p id="feedback" class="notice" role="status" hidden></p>
<section id="admin-login" class="card" hidden><h2>连接主控</h2><p class="muted">从主控的设置进入，可沿用当前登录。</p><form id="admin-form"><label>管理员凭证<input id="admin-token" type="password" required autocomplete="off"></label><button class="primary">继续</button></form></section>
<div id="access-workspace" hidden>
  <div class="access-grid">
    <section class="card access-intro"><span class="phone-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4M11 18h2"/></svg></span><span class="eyebrow">一次配对，自动接入</span><h2>把实验台装进口袋</h2><p class="muted">查看进度、指标和日志。配对后再次打开，直接回到实验界面。</p><ol class="pairing-steps"><li>选择手机可访问的主控地址</li><li>为手机创建设备凭证</li><li>复制配对信息，在手机粘贴一次</li></ol><label>主控地址<input id="address" type="url" placeholder="http://192.168.1.10:8765" list="addresses"><datalist id="addresses"></datalist></label><a id="mobile-link" class="link-button" href="/mobile/" target="_blank" rel="noopener">打开移动界面 <span aria-hidden="true">↗</span></a><p class="muted small">手机与主控需网络互通；使用电脑的私网地址，跨网使用有效 HTTPS 或可信私网。</p></section>
    <section class="card"><span class="eyebrow">新设备</span><h2>配对手机</h2><form id="enroll-form"><label>设备名称<input id="device-name" required maxlength="80" placeholder="例如 我的 Mate 70 Pro"></label><div class="access-fields"><label>权限<select id="permission"><option value="monitor">只读监控</option><option value="control">监控与有限操作</option></select></label><label>有效期<select id="days"><option value="0">长期有效，直到撤销</option><option value="7">7 天</option><option value="30">30 天</option><option value="90">90 天</option></select></label></div><p class="muted small">可操作设备还能停止、恢复实验及调整节点接单。</p><button id="create" class="primary">创建设备凭证</button></form>
      <div id="issued" class="issued" hidden><div class="heading"><h3>配对信息已就绪</h3><span class="badge online">仅显示一次</span></div><label>配对链接<textarea id="issued-pairing" readonly rows="3" spellcheck="false"></textarea></label><div class="actions"><button id="copy-pairing" class="primary">复制配对信息</button><button id="hide-token" class="quiet">完成</button></div><details><summary>单独复制凭证</summary><textarea id="issued-token" readonly rows="2" spellcheck="false" aria-label="移动凭证"></textarea><button id="copy-token" class="quiet">复制凭证</button></details></div>
    </section>
  </div>
  <section class="card devices-card"><div class="heading"><div><span class="eyebrow">已配对</span><h2>我的设备</h2></div><button id="reload" class="quiet">刷新</button></div><div id="devices"></div></section>
</div></main><script src="/mobile/access.js" defer></script>
</body></html>
